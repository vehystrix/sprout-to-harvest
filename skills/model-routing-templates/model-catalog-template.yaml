# Model catalog template for the implementation agent workflow.
#
# Placement: copy this file to `<repo>/.implementation-agent/model-catalog.yaml` and
# version-control it. Effective run copies live under `.agent-work/<run-id>/model-catalog.yaml`;
# the orchestrator freezes those copies at run start. The repository file is the source of truth;
# the run copy is the authoritative runtime input for a single run.
#
# Required fields per entry: `id` (unique portable model identifier), `capabilities`
# (normalized names from the capability vocabulary in model-catalog-format), `tier`
# (integer; larger indicates stronger default suitability), `cost` (`low`, `medium`, or
# `high`), `context_window` (maximum supported token window), `tools` (supported host tools),
# and `hosts` (optional mapping of active host identifiers to host-specific selector strings).
# To add a new entry, copy any existing block below, change the `id` and its fields, and
# keep field names consistent. Host selectors are data values — never executable commands —
# and host mappings are declared for each host that should support per-delegation model
# selection; a missing key is a valid state whose runs take the routing-unavailable path.

models:
  - id: reasoning-pro
    # Serves plan_auditor, step_decomposer, and verifier (tier >= 2 with reasoning coverage).
    capabilities:
      - reasoning
      - planning
      - verification
    tier: 3
    cost: high
    context_window: 200000
    tools:
      - read
      - search
      - edit
      - execute
    hosts:
      copilot: Claude Opus 4.8 (copilot)

  - id: coding-standard
    # Serves implementer (tier >= 1 with coding and testing coverage).
    capabilities:
      - coding
      - testing
    tier: 1
    cost: medium
    context_window: 128000
    tools:
      - read
      - search
      - edit
      - execute
    hosts:
      copilot: Code Model (copilot)

  - id: doc-verification
    # Serves documentation_verifier; a tier >= 2 entry carrying both `documentation` and
    # `verification` is required, or that role would be unsatisfiable.
    capabilities:
      - documentation
      - verification
    tier: 2
    cost: medium
    context_window: 128000
    tools:
      - read
      - search
      - edit
    hosts:
      copilot: Claude Sonnet 4.5 (copilot)

  - id: documentation-standard
    # Serves documentation_writer (tier >= 1 with documentation coverage).
    capabilities:
      - documentation
    tier: 1
    cost: low
    context_window: 64000
    tools:
      - read
      - search
      - edit
    hosts:
      copilot: Code Model (copilot)

  - id: cheap-general
    # The policy fallback target; the cheapest general-purpose entry in this catalog.
    capabilities:
      - general
    tier: 0
    cost: low
    context_window: 64000
    tools:
      - read
      - search
    hosts:
      copilot: Haiku (copilot)
